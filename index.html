    <script>
      (function() {
        function createStorageShim() {
          var store = {};
          return {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null; },
            setItem: function(k, v) { store[k] = String(v); },
            removeItem: function(k) { delete store[k]; },
            clear: function() { store = {}; },
            key: function(i) { return Object.keys(store)[i] || null; },
            get length() { return Object.keys(store).length; }
          };
        }

        try {
          var ls = window.localStorage;
          var testKey = '__storage_test__';
          ls.setItem(testKey, testKey);
          ls.removeItem(testKey);
        } catch (e) {
          try {
            var shim = createStorageShim();
            Object.defineProperty(window, 'localStorage', {
              value: shim,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
        }

        try {
          var ss = window.sessionStorage;
          var testKey2 = '__storage_test2__';
          ss.setItem(testKey2, testKey2);
          ss.removeItem(testKey2);
        } catch (e) {
          try {
            var shim2 = createStorageShim();
            Object.defineProperty(window, 'sessionStorage', {
              value: shim2,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
        }

        var origOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var str = String(msg || '') + (error && error.message ? String(error.message) : '');
          if (str.toLowerCase().indexOf('insecure') !== -1 || (error && error.name === 'SecurityError')) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
          return false;
        };

        window.addEventListener('error', function(e) {
          var msg = e && (e.message || (e.error && e.error.message)) || '';
          if (typeof msg === 'string' && (msg.toLowerCase().includes('insecure') || (e.error && e.error.name === 'SecurityError'))) {
            e.preventDefault();
            e.stopPropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (typeof msg === 'string' && (msg.toLowerCase().includes('insecure') || (reason && reason.name === 'SecurityError'))) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        window.addEventListener('vite:preloadError', function(event) {
          event.preventDefault();
          try {
            var reloadKey = 'kkm_vite_preload_ts';
            var lastReload = window.sessionStorage.getItem(reloadKey);
            var now = Date.now();
            if (!lastReload || now - parseInt(lastReload, 10) > 10000) {
              window.sessionStorage.setItem(reloadKey, String(now));
              window.location.reload();
            }
          } catch (_) {
            window.location.reload();
          }
        });
      })();
    </script>

    <style>
      :root {
        --bg-grad-1: #F8F9FA;
        --bg-grad-2: #eef7ff;
        --bg-grad-3: #FFF9C4;
      }
      .dark {
        --bg-grad-1: #0f172a; /* slate-900 */
        --bg-grad-2: #1e293b; /* slate-800 */
        --bg-grad-3: #021a33;
        color-scheme: dark;
      }
      /* Global Text Color Override for Dark Mode for better contrast */
      .dark body {
        color: #e2e8f0; /* slate-200 */
      }
      .dark .text-text-light {
        color: #cbd5e1 !important; /* slate-300 */
      }
      
      /* Prevent accidental horizontal overflow on all screen sizes */
      html, body {
        max-width: 100vw;
        overflow-x: hidden;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      body {
        background: linear-gradient(270deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-1));
        background-size: 600% 600%;
        animation: gradient-animation 45s ease infinite;
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Touch scroll utility for mobile drawers & carousels */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Persian typography line height & numeral legibility */
      [dir="rtl"] {
        letter-spacing: normal;
        word-spacing: -0.02em;
      }

      /* High-performance Shimmer Skeleton Effect */
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .shimmer-box {
        position: relative;
        overflow: hidden;
        background-color: #e2e8f0;
      }
      .dark .shimmer-box {
        background-color: #1e293b;
      }
      .shimmer-box::after {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.55) 50%,
          rgba(255, 255, 255, 0) 100%
        );
        animation: shimmer 1.8s ease-in-out infinite;
        content: '';
        pointer-events: none;
      }
      .dark .shimmer-box::after {
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.09) 50%,
          rgba(255, 255, 255, 0) 100%
        );
      }
      [dir="rtl"] .shimmer-box::after {
        animation-direction: reverse;
      }
      @keyframes gradient-animation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px; /* Offset for sticky header */
      }
      .gradient-hero {
        background-image: linear-gradient(98deg, #0A92EF 0%, #002D56 100%);
      }
      @keyframes marker-pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.25); }
        100% { transform: scale(1); }
      }
      .animate-marker-pop {
        animation: marker-pop 0.5s ease-out;
      }
      @keyframes marker-pulse {
        0%, 100% {
            transform: scale(1);
            opacity: 1;
        }
        50% {
            transform: scale(1.2);
            opacity: 0.7;
        }
      }
      .animate-marker-pulse {
          animation: marker-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .logo-container svg {
        transition: filter 0.3s ease-in-out;
      }
      .logo-container:hover svg {
        filter: drop-shadow(0 0 6px #0A92EF);
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .dark ::-webkit-scrollbar-track {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      /* Accessibility: Focus Ring - High Contrast & Visibility */
      :focus-visible {
        outline: 3px solid #FFC107;
        outline-offset: 3px;
        box-shadow: 0 0 0 4px #002D56; /* Added secondary darker ring for light backgrounds */
        border-radius: 2px;
      }
      .dark :focus-visible {
        outline: 3px solid #FFC107;
        outline-offset: 3px;
        box-shadow: 0 0 0 4px #F8F9FA; /* Light secondary ring for dark mode */
      }
      /* Ensure focus isn't hidden by overflow hidden containers generally */
      *:focus {
        scroll-margin-top: 100px;
      }
